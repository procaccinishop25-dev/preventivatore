<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Drawing Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="header-left">
        <button id="btn-back" class="icon-btn" title="Indietro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <span id="editor-title">Schizzo</span>
      </div>
      <button id="btn-save" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        Salva
      </button>
    </header>

    <div id="canvas-wrapper">
      <canvas id="fabric-canvas"></canvas>

      <div id="zoom-controls">
        <button class="zoom-btn" id="btn-zoom-out" title="Riduci">−</button>
        <span id="zoom-label">100%</span>
        <button class="zoom-btn" id="btn-zoom-in" title="Ingrandisci">+</button>
      </div>

      <div id="toolbar">
        <button class="tool-btn active" data-tool="select" title="Seleziona">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 2l7.07 16.97 2.51-7.39 7.39-2.51L3 2z"/></svg>
        </button>
        <button class="tool-btn" data-tool="pen" title="Penna">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Gomma">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-6-6a2 2 0 010-2.83l9-9a2 2 0 012.83 0l6 6a2 2 0 010 2.83L14 16"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Linea">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rettangolo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Cerchio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
        </button>
        <button class="tool-btn" data-tool="photo" title="Foto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input type="file" id="photo-input" accept="image/*" style="display:none;">

        <div class="toolbar-separator"></div>

        <div class="color-palette">
          <button class="color-btn active" data-color="#000000" style="background-color:#000000;" title="Nero"></button>
          <button class="color-btn" data-color="#2563EB" style="background-color:#2563EB;" title="Blu"></button>
          <button class="color-btn" data-color="#DC2626" style="background-color:#DC2626;" title="Rosso"></button>
          <button class="color-btn color-btn-white" data-color="#FFFFFF" style="background-color:#FFFFFF;" title="Bianco"></button>
        </div>

        <div class="toolbar-separator"></div>

        <button id="btn-undo" class="tool-btn" title="Annulla">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
        </button>
        <button id="btn-redo" class="tool-btn" title="Ripristina">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
        </button>
        <button id="btn-delete" class="tool-btn" title="Elimina selezionato">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <script src="streamlit-bridge.js"></script>
  <script src="editor.js"></script>
  <script src="toolbar.js"></script>
  <script src="app.js"></script>
</body>
</html>
